  <title>Sensa | AI-Powered Dual-Mode Accessibility Chrome Extension</title>
  <meta name="description"
    content="Sensa is a free, open-source Google Chrome extension that empowers low-vision and hearing-impaired users to navigate the web with AI-powered live subtitles, voice controls, and smart visual tools." />

    content="accessibility, Chrome extension, low vision, hearing impaired, live subtitles, voice control, screen reader, BulSU, capstone, AI translation, accessibility tool, WCAG 2.1" />

  <meta name="theme-color" content="#0A44FF" />

  <!-- Open Graph (Facebook, LinkedIn, Discord) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Sensa" />
  <meta property="og:title" content="Sensa | AI-Powered Accessibility Chrome Extension" />
  <meta property="og:description"
    content="Empowering low-vision and hearing-impaired users with AI live subtitles, 135+ language translations, and smart voice controls." />
  <meta property="og:image" content="/sensa-logo.png" />
  <meta property="og:image:alt" content="Sensa Logo" />

  <meta name="twitter:title" content="Sensa | AI-Powered Accessibility Chrome Extension" />

<body>
  <div id="root"></div>
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new window.google.translate.TranslateElement(
        { pageLanguage: 'en', layout: window.google.translate.TranslateElement.InlineLayout.SIMPLE },
        'google_translate_element'
      );
    }
  </script>
  <script type="text/javascript"
    src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
  <script type="module" src="/src/main.tsx"></script>
</body>
